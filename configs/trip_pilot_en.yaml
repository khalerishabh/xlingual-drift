# Trip domain, step 1 of 2: English-only difficulty pilot (docs/TRIP_SPEC.md,
# "Difficulty is set on English only"). 1 template x 4 horizons x 5 seeds
# = 20 episodes. Decision rule, fixed before any run: if English success at
# h11 is below 0.8, simplify the task and rerun this pilot; otherwise the
# design is frozen and trip_gate_v1 runs unchanged in all languages.

run_name: trip_pilot_en_qwen36_27b_fp8

serving:
  model: Qwen/Qwen3.6-27B-FP8
  revision: e89b16ebf1988b3d6befa7de50abc2d76f26eb09
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  max_model_len: 65536
  min_vram_gb: 38
  vllm_version: "0.30.0"
  extra_args: []

templates:
  - tasks/trip_templates/trip_001.json
interface_mode: strict
max_steps: 60
horizons: [11, 17, 24, 28]
languages: [en]

cells:
  - name: qwen36_27b_fp8_think
    policy: openai_compat
    model: Qwen/Qwen3.6-27B-FP8
    base_url: http://localhost:8000/v1
    temperature: 0.6
    max_tokens: 8192
    extra_body: {chat_template_kwargs: {enable_thinking: true}}
    seeds: [1, 2, 3, 4, 5]
