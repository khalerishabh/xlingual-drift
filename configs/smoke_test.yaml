# No API key, no GPU. Checks the harness end to end on every template and
# horizon: gold replays, all three deviation types are caught, and both
# recovery paths work. Language is recorded but ignored by the mock policy.

run_name: smoke_test
templates:
  - tasks/templates/travel_017.json
  - tasks/templates/travel_018.json
  - tasks/templates/travel_019.json
interface_mode: strict
max_steps: 24
horizons: [2, 4, 6, 8, 10, 12]
languages: [en]

cells:
  - name: solve
    policy: mock
    mock_mode: solve
    seeds: [1]
  - name: drop_early
    policy: mock
    mock_mode: deviate_drop_constraint
    seeds: [1]
  - name: wrong_objective
    policy: mock
    mock_mode: deviate_wrong_flight
    seeds: [1]
  - name: drop_late
    policy: mock
    mock_mode: deviate_drop_late
    seeds: [1]
  - name: recover_notfound_en
    policy: mock
    mock_mode: recover
    seeds: [1]
    inject: {error_type: not_found, at_tool: book_flight, message_language: en}
  - name: recover_transient_zh
    policy: mock
    mock_mode: recover
    seeds: [1]
    inject: {error_type: transient, at_tool: search_flights, message_language: zh}
  - name: no_recovery_notfound
    policy: mock
    mock_mode: solve
    seeds: [1]
    inject: {error_type: not_found, at_tool: book_flight, message_language: en}
