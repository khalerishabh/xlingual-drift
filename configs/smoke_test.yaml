# No API key, no GPU. Checks the harness end to end at every horizon:
# gold replays, both deviations are caught, and both recovery paths work.
# Language is recorded but ignored by the mock policy.

run_name: smoke_test
template: tasks/templates/travel_017.json
interface_mode: strict
max_steps: 20
horizons: [2, 4, 6, 8]
languages: [en]

cells:
  - policy: mock
    mock_mode: solve
    seed: 1
  - policy: mock
    mock_mode: deviate_drop_constraint
    seed: 1
  - policy: mock
    mock_mode: deviate_wrong_flight
    seed: 1
  - policy: mock
    mock_mode: recover
    seed: 1
    inject: {error_type: not_found, at_tool: book_flight, message_language: en}
  - policy: mock
    mock_mode: recover
    seed: 1
    inject: {error_type: transient, at_tool: search_flights, message_language: zh}
  - policy: mock
    mock_mode: solve
    seed: 1
    inject: {error_type: not_found, at_tool: book_flight, message_language: en}
